<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 2048 512" width="2048" height="512">
  <defs>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=Inter:wght@700;800;900&amp;display=swap');
      .brand-title {
        font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
        font-weight: 800;
        font-size: 215px;
        letter-spacing: -3px;
      }
      .brand-sub {
        font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
        font-weight: 700;
        font-size: 30px;
        letter-spacing: 6.5px;
      }
    </style>
  </defs>

  <rect width="2048" height="512" rx="48" fill="#062219" />

  <!-- Left Mark: scale and translate from 1024x1024 to 460x460, placed at x=100, y=26 -->
  <g transform="translate(100, 26) scale(0.45)">
    
  
        <defs>
          <linearGradient id="swooshDark" x1="0%" y1="100%" x2="100%" y2="0%">
            <stop offset="0%" stop-color="#166B50" />
            <stop offset="35%" stop-color="#22C55E" />
            <stop offset="100%" stop-color="#4ADE80" />
          </linearGradient>
        </defs>
        
  <!-- Document Outline & Body -->
  <path d="M 330 160
           C 270 160, 220 210, 220 270
           L 220 730
           C 220 790, 270 840, 330 840
           L 640 840
           C 700 840, 750 790, 750 730
           L 750 360
           L 550 160
           Z"
        fill="transparent"
        stroke="#FFFFFF"
        stroke-width="56"
        stroke-linejoin="round" />

  <!-- Dog-ear fold top-right -->
  <path d="M 550 160
           L 750 360
           L 590 360
           C 568 360, 550 342, 550 320
           Z"
        fill="#22C55E" />

  <!-- Document horizontal lines -->
  <rect x="310" y="300" width="160" height="32" rx="16" fill="#FFFFFF" />
  <rect x="310" y="380" width="240" height="32" rx="16" fill="#FFFFFF" />
  <rect x="310" y="460" width="200" height="32" rx="16" fill="#FFFFFF" />

  <!-- Rising Bar Chart Pillars -->
  <rect x="470" y="650" width="56" height="130" rx="14" fill="#FFFFFF" />
  <rect x="546" y="570" width="56" height="210" rx="14" fill="#FFFFFF" />
  <rect x="622" y="490" width="56" height="290" rx="14" fill="#FFFFFF" />

  <!-- Orbit Swoosh -->
  
        <path d="M 140 700 C 100 850, 260 950, 460 910 C 660 870, 820 700, 840 510 C 844 470, 800 470, 790 510 C 750 680, 580 820, 390 830 C 260 836, 170 770, 190 690 C 196 660, 150 660, 140 700 Z" fill="url(#swooshDark)" />
        

  </g>

  <!-- Brand Typography -->
  <g transform="translate(605, 305)">
    <text class="brand-title">
      <tspan fill="#FFFFFF">Invo</tspan><tspan fill="#22C55E">Desk</tspan>
    </text>
  </g>

  <!-- Tagline & Rules -->
  <!-- Left Rule -->
  <line x1="610" y1="395" x2="710" y2="395" stroke="#22C55E" stroke-width="4.5" stroke-linecap="round" />

  <!-- Subtitle Text -->
  <text x="735" y="405" class="brand-sub" fill="#F5F7F6">GST BILLING &amp; BUSINESS OPERATIONS</text>

  <!-- Right Rule -->
  <line x1="1560" y1="395" x2="1660" y2="395" stroke="#22C55E" stroke-width="4.5" stroke-linecap="round" />
</svg>